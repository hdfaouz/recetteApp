<div class="posts-grid">
    <article class="post-card" *ngIf="recipeDetail">
      <img [src]="recipe.img || 'assets/images/default-recipe.jpg'" alt="{{recipeDetail.nom}}" class="recipe-image">
  
      <div class="post-content">
        <h2 class="post-title">{{recipeDetail.nom}}</h2>
        
        <div class="post-meta">
          <h3>Ingrédients :</h3>
          <ul>
            <li *ngFor="let ingredient of recipeDetail.ingredients.split(',')">
              {{ingredient.trim()}}
            </li>
          </ul>
        </div>
  
        <div class="post-excerpt">
          <h3>Étapes de préparation :</h3>
          <ol>
            <li *ngFor="let step of recipeDetail.etapes.split('\n')">
              {{step.trim()}}
            </li>
          </ol>
        </div>
  
        <div class="recipe-footer">
          <span class="tag">{{recipeDetail.categorie}}</span>
          <p><b>Date : </b>{{recipeDetail.date | date:'dd/MM/yyyy'}}</p>
        </div>
      </div>
    </article>
  </div>
